*{

html{

button{

::selection{

/* =========================
   PRELOADER
========================= */

.preloader{
  position:fixed;
  inset:0;
  background:var(--wood-dark);
  z-index:9999;
  display:grid;
  place-items:center;
  transition:.8s var(--ease);
}

.preloader.hide{
  opacity:0;
  visibility:hidden;
}

.loader{
  text-align:center;
  color:white;
}

.loader img{
  width:75px;
  height:75px;
  object-fit:contain;
  margin:auto;
}

.loader h3{
  font-family:"Playfair Display",serif;
  font-size:25px;
  font-weight:400;
  margin:18px 0;
}

.loader-bar{
  width:170px;
  height:1px;
  background:#ffffff30;
  overflow:hidden;
  margin:auto;
}

.loader-bar span{
  display:block;
  height:100%;
  width:35%;
  background:#fff;
  animation:loading 1.2s infinite;
}

@keyframes loading{
  to{
    transform:translateX(480%);
  }
}


/* =========================
   NAVIGATION
========================= */

.nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  height:82px;
  padding:0 5vw;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(18px);
  border-bottom:1px solid transparent;
  transition:.35s ease;
}

.nav.scrolled{
  height:72px;
  border-color:var(--line);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:48px;
  height:48px;
  object-fit:contain;
}

.logo-text strong{
  display:block;
  font-family:"Playfair Display",serif;
  font-size:20px;
  font-weight:500;
}

.logo-text span{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:8px;
  letter-spacing:.18em;
  text-transform:uppercase;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:30px;
}

.nav-links a{
  position:relative;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.16em;
}

.nav-links a:after{
  content:"";
  position:absolute;
  bottom:-8px;
  left:0;
  width:0;
  height:1px;
  background:var(--wood);
  transition:.3s ease;
}

.nav-links a:hover:after{
  width:100%;
}

.nav-cta{
  padding:12px 17px;
  background:var(--wood);
  color:white;
}

.nav-cta:after{
  display:none;
}

.menu-btn{
  display:none;
  width:42px;
  height:42px;
  border:1px solid var(--line);
  background:white;
  font-size:20px;
}


/* =========================

========================= */

section{

}

}

.container{

.section-title{

/* =========================
   BUTTONS
========================= */

.btn{

  justify-content:center;
  gap:10px;
  min-height:50px;
  padding:0 23px;
  border:1px solid var(--black);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:9px;
  transition:.3s var(--ease);
}

.btn-dark{
  background:var(--wood);
  color:white;
  border-color:var(--wood);
}

.btn-light{
  background:white;
  color:var(--wood);
  border-color:white;
}

.btn:hover{
  background:var(--wood-light);
  border-color:var(--wood-light);
  color:white;
  transform:translateY(-3px);
}

========================= */

.hero{

}

.hero-overlay{
  position:absolute;

  /* Neutral overlay only for text readability */
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.68) 0%,
      rgba(0,0,0,.38) 42%,
      rgba(0,0,0,.08) 78%,
      rgba(0,0,0,.16) 100%
    );
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:800px;
}

.hero .kicker{
  color:#f1f1f1;
}

.hero h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(62px,9vw,130px);

.hero h1 em{

.hero-copy{

========================= */

.about-section{

  display:flex;
  align-items:center;
  overflow:hidden;

  /* Brown background removed.
     Image stays clear with neutral overlay. */
  background:
    linear-gradient(

      rgba(0,0,0,.42) 48%,

    ),
    url("about.png") center center / cover no-repeat;

  color:white;
}

.about-section:before{
  content:"";

  /* Neutral readability overlay */
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.12),
      transparent 45%,
      rgba(0,0,0,.28)
    );

.about-content{

.about-inner{

}

   SERVICES
========================= */

.service-grid{

}

.service{

}

.product-meta{

.product-meta span{

  letter-spacing:.12em;

}

.product-controls,

}

.arrow:hover{

  color:var(--wood);
}

.product-image{

}

.product-image img{
  height:100%;

.process-number{
